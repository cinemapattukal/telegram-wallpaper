<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wallpaper Hub — Premium Telegram Mini App</title>
<style>
:root{--bg:#07111b;--surface:#0d1a28;--surface2:#132538;--line:#20364b;--text:#f5f8fc;--muted:#91a4b8;--blue:#19a8ee;--blue2:#168de0;--danger:#ff5470}
*{box-sizing:border-box}html,body{margin:0;background:#02080e;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}
#app{width:min(100%,1100px);min-height:100vh;margin:auto;background:var(--bg);position:relative}
header{height:64px;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(7,17,27,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.menuBtn,.headIcon{width:40px;height:40px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font-size:20px}.brand{flex:1;text-align:center;font-weight:800}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
.page{padding:15px 15px 88px}.search{display:flex;gap:9px}.search input{min-width:0;flex:1;border:1px solid #29435d;background:var(--surface2);border-radius:15px;color:#fff;padding:13px 15px;outline:0}.search input:focus{border-color:var(--blue)}
.hero{margin-top:14px;height:190px;border-radius:20px;overflow:hidden;position:relative}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.05) 70%),linear-gradient(0deg,rgba(0,0,0,.6),transparent 55%)}.heroText{position:absolute;z-index:2;left:17px;bottom:16px}.heroText small{background:rgba(0,0,0,.45);padding:5px 9px;border-radius:9px}.heroText h1{font-size:24px;margin:8px 0 4px}.heroText p{margin:0;color:#d5dfeb;font-size:12px}
.chips{display:flex;gap:8px;overflow:auto;padding:14px 0 4px}.chip{white-space:nowrap;padding:9px 14px;border-radius:999px;background:var(--surface2);color:#b7c8d8}.chip.active{background:var(--blue);color:white}
.title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}.title h2{font-size:18px;margin:0}.title a{color:#42b9f3;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{aspect-ratio:3/4.2;border-radius:15px;overflow:hidden;position:relative;background:var(--surface2)}.card img{width:100%;height:100%;object-fit:cover}.card:after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.9))}.card .tag{position:absolute;z-index:2;top:7px;left:7px;background:rgba(0,0,0,.55);padding:5px 8px;border-radius:8px;font-size:10px}.card .ct{position:absolute;z-index:2;left:9px;right:7px;bottom:9px;font-weight:750;font-size:12px}.card .ct span{display:block;color:#b9c8d6;font-size:10px;font-weight:500;margin-top:2px}
.bottom{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,1100px);height:70px;background:rgba(6,15,24,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.nav{background:none;color:#8095aa;font-size:10px}.nav b{display:block;font-size:21px;margin-bottom:3px}.nav.active{color:var(--blue)}
.viewer{display:none;position:fixed;z-index:100;inset:0;background:#000}.viewer.show{display:block}.viewer img{width:100%;height:100%;object-fit:contain}.vtop{position:absolute;z-index:2;left:15px;right:15px;top:15px;display:flex;justify-content:space-between}.round{width:45px;height:45px;border-radius:50%;background:rgba(20,30,42,.8);font-size:21px}.vactions{position:absolute;right:15px;bottom:25%;display:flex;flex-direction:column;gap:10px}.vthumbs{position:absolute;left:12px;right:12px;bottom:84px;display:flex;gap:6px;overflow:auto}.vthumbs img{width:64px;height:64px;object-fit:cover;border-radius:9px;border:2px solid transparent}.vthumbs img:first-child{border-color:white}.vbottom{position:absolute;left:15px;right:15px;bottom:15px;display:flex;gap:8px}.vbottom button{flex:1;padding:13px;border-radius:13px;background:var(--blue);font-weight:800}.vbottom .secondary{background:#172536}
.profile{text-align:center;padding-top:18px}.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid var(--blue)}.profile h2{margin:10px 0 3px}.profile p{margin:0;color:var(--muted)}.menuList{margin-top:20px;border:1px solid var(--line);border-radius:16px;overflow:hidden}.menuList button{width:100%;display:flex;text-align:left;padding:16px;background:var(--surface);border-bottom:1px solid var(--line)}.menuList button:last-child{border:0}.menuList i{width:30px}.logout{color:#ff687c!important}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{height:135px;position:relative;border-radius:15px;overflow:hidden}.cat img{width:100%;height:100%;object-fit:cover}.cat:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.9))}.cat div{position:absolute;z-index:2;bottom:10px;left:11px;font-weight:800}.cat small{display:block;color:#c4d0dc;font-weight:500;margin-top:3px}
.login{min-height:100vh;display:grid;place-items:center;padding:25px;background:#020a12}.loginBox{width:min(390px,100%);text-align:center}.loginHero{height:400px;border-radius:25px;overflow:hidden;position:relative;background:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=90') center/cover}.loginHero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(0,0,0,.95))}.loginContent{position:absolute;z-index:2;inset:auto 18px 22px}.tg{width:72px;height:72px;border-radius:50%;background:#19a8ee;display:grid;place-items:center;font-size:34px;margin:auto}.loginContent h1{margin:12px 0 5px}.loginContent p{color:#c2cfdb;font-size:13px}.loginBtn{width:100%;padding:15px;border-radius:15px;background:var(--blue);font-weight:800;margin-top:13px}.hidden{display:none!important}
.admin{min-height:100vh;background:#f4f7fa;color:#152436}.adminHead{height:65px;background:white;border-bottom:1px solid #dce5ed;display:flex;align-items:center;padding:0 16px;gap:10px}.adminBody{display:grid;grid-template-columns:220px 1fr}.side{background:#fff;min-height:calc(100vh - 65px);padding:12px;border-right:1px solid #dce5ed}.side button{width:100%;background:#fff;color:#516477;text-align:left;padding:12px;border-radius:9px;margin-bottom:4px}.side button.active{background:#e8f5ff;color:#0c8ed2}.dash{padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #dce5ed;border-radius:13px;padding:17px}.stat small{color:#6d8195}.stat b{display:block;font-size:24px;margin-top:5px}.table{margin-top:15px;background:#fff;border:1px solid #dce5ed;border-radius:13px;padding:14px}.tr{display:grid;grid-template-columns:55px 1fr 100px 80px;gap:10px;align-items:center;border-top:1px solid #edf1f5;padding:9px 0;font-size:13px}.tr img{width:50px;height:50px;border-radius:7px;object-fit:cover}.edit{background:#138fe0;padding:7px;border-radius:7px}.del{background:#ff5366;padding:7px;border-radius:7px}
@media(min-width:701px){.grid{grid-template-columns:repeat(5,1fr)}.hero{height:230px}}
@media(max-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.page{padding-left:12px;padding-right:12px}.adminBody{display:block}.side{display:flex;overflow:auto;min-height:auto}.side button{white-space:nowrap;width:auto;margin-right:5px}.stats{grid-template-columns:repeat(2,1fr)}.tr{grid-template-columns:50px 1fr 60px}.tr .hide{display:none}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="loginBox"><div class="loginHero"><div class="loginContent"><div class="tg">➤</div><h1>Wallpaper Hub</h1><p>Telegram Mini App<br>HD • 4K • Ultra HD Wallpapers</p><button class="loginBtn" onclick="enter()">➤ &nbsp; Continue with Telegram</button></div></div></div>
</div>
<div id="app" class="hidden">
<header><button class="menuBtn" onclick="show('home')">☰</button><div class="brand">Wallpaper Hub<small>Telegram Mini App</small></div><button class="headIcon" onclick="show('search')">⌕</button></header>
<main id="content"></main>
<nav class="bottom"><button class="nav active" data-p="home" onclick="show('home')"><b>⌂</b>Home</button><button class="nav" data-p="categories" onclick="show('categories')"><b>▦</b>Categories</button><button class="nav" data-p="favorites" onclick="show('favorites')"><b>♡</b>Favorites</button><button class="nav" data-p="profile" onclick="show('profile')"><b>♙</b>Profile</button></nav>
</div>
<div id="viewer" class="viewer"><div class="vtop"><button class="round" onclick="closeV()">×</button><button class="round" onclick="share()">↗</button></div><img id="vimg"><div class="vactions"><button class="round" onclick="fav()">♡</button><button class="round" onclick="download()">↓</button><button class="round" onclick="share()">↗</button></div><div class="vthumbs" id="thumbs"></div><div class="vbottom"><button onclick="download()">⬇ Download</button><button class="secondary" onclick="share()">Share</button></div></div>
<script>
const W=[
{id:1,t:'Mountain Lake',c:'Nature',u:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=90'},
{id:2,t:'Sports Car',c:'Cars',u:'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1000&q=90'},
{id:3,t:'Forest',c:'Nature',u:'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1000&q=90'},
{id:4,t:'City Night',c:'City',u:'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1000&q=90'},
{id:5,t:'Ocean',c:'Nature',u:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=90'},
{id:6,t:'Flowers',c:'Nature',u:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1000&q=90'},
{id:7,t:'Mountain Road',c:'Travel',u:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=90'},
{id:8,t:'Anime Style',c:'Anime',u:'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1000&q=90'},
{id:9,t:'Night Drive',c:'Cars',u:'https://images.unsplash.com/photo-1493238792000-8113da705763?auto=format&fit=crop&w=1000&q=90'},
{id:10,t:'Modern City',c:'City',u:'https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1000&q=90'}
];
const C=[['Nature',W[0].u,'1.5K Wallpapers'],['Cars',W[1].u,'980 Wallpapers'],['Anime',W[7].u,'1.2K Wallpapers'],['City',W[3].u,'860 Wallpapers'],['Travel',W[6].u,'740 Wallpapers'],['Abstract',W[5].u,'1.1K Wallpapers']];
let favs=JSON.parse(localStorage.getItem('wh_favs')||'[]'),cur=null,q='';
function enter(){localStorage.setItem('wh_login','1');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');show('home')}
function card(w){return `<div class="card" onclick="openV(${w.id})"><img src="${w.u}" loading="lazy"><span class="tag">${w.c}</span><div class="ct">${w.t}<span>HD • 4K</span></div></div>`}
function home(){let a=W.filter(w=>(w.t+' '+w.c).toLowerCase().includes(q.toLowerCase()));return `<div class="page"><div class="search"><input value="${q}" placeholder="⌕  Search wallpapers..." oninput="q=this.value;show('home')"><button class="headIcon">☷</button></div><div class="hero"><img src="${W[1].u}"><div class="heroText"><small>Featured</small><h1>Explore Stunning Wallpapers</h1><p>HD • 4K • Ultra HD &nbsp; • &nbsp; Daily updates</p></div></div><div class="chips"><button class="chip active">All</button><button class="chip">Nature</button><button class="chip">Cars</button><button class="chip">Anime</button><button class="chip">City</button></div><div class="title"><h2>Latest Wallpapers</h2><a>${a.length} Wallpapers ›</a></div><div class="grid">${a.length?a.map(card).join(''):'<div style="grid-column:1/-1;text-align:center;color:#8fa2b7;padding:40px">No wallpapers found</div>'}</div></div>`}
function categories(){return `<div class="page"><div class="title"><h2>Categories</h2><a>View All</a></div><div class="categories">${C.map(x=>`<div class="cat" onclick="q='${x[0]}';show('home')"><img src="${x[1]}"><div>${x[0]}<small>${x[2]}</small></div></div>`).join('')}</div></div>`}
function favorites(){let a=W.filter(w=>favs.includes(w.id));return `<div class="page"><div class="title"><h2>♥ My Favorites</h2><a>${a.length}</a></div><div class="grid">${a.length?a.map(card).join(''):'<div style="grid-column:1/-1;text-align:center;color:#8fa2b7;padding:50px">No favorites yet</div>'}</div></div>`}
function profile(){return `<div class="page"><div class="profile"><img class="avatar" src="https://i.pravatar.cc/200?img=12"><h2>Telegram User</h2><p>@wallpaper_user</p></div><div class="menuList"><button><i>♡</i> My Favorites <span style="margin-left:auto">${favs.length}</span></button><button><i>↓</i> Download History</button><button><i>⚙</i> Settings</button><button><i>ⓘ</i> About</button><button class="logout" onclick="logout()"><i>⊗</i> Logout</button></div><button onclick="admin()" style="display:block;margin:22px auto;background:white;color:#162438;padding:12px 18px;border-radius:12px">Open Demo Admin</button></div>`}
function searchPage(){return `<div class="page"><div class="search"><input autofocus placeholder="Search wallpapers..." oninput="q=this.value;renderSearch()"><button class="headIcon">×</button></div><div class="chips"><button class="chip active">All</button><button class="chip">Images</button><button class="chip">Categories</button><button class="chip">Tags</button></div><div id="searchResults" class="grid">${W.map(card).join('')}</div></div>`}
function renderSearch(){let el=document.getElementById('searchResults');if(!el)return;el.innerHTML=W.filter(w=>(w.t+' '+w.c).toLowerCase().includes(q.toLowerCase())).map(card).join('')}
function show(p){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.p===p));let c=document.getElementById('content');if(p==='home')c.innerHTML=home();else if(p==='categories')c.innerHTML=categories();else if(p==='favorites')c.innerHTML=favorites();else if(p==='profile')c.innerHTML=profile();else c.innerHTML=searchPage()}
function openV(id){cur=W.find(w=>w.id===id);document.getElementById('vimg').src=cur.u;document.getElementById('thumbs').innerHTML=W.slice(0,8).map(w=>`<img src="${w.u}" onclick="openV(${w.id})">`).join('');document.getElementById('viewer').classList.add('show')}
function closeV(){document.getElementById('viewer').classList.remove('show')}
function fav(){if(!cur)return;if(favs.includes(cur.id))favs=favs.filter(x=>x!==cur.id);else favs.push(cur.id);localStorage.setItem('wh_favs',JSON.stringify(favs))}
function download(){if(!cur)return;window.open(cur.u,'_blank')}
async function share(){if(!cur)return;if(navigator.share){try{await navigator.share({title:cur.t,text:'Wallpaper Hub',url:cur.u})}catch(e){}}else navigator.clipboard?.writeText(cur.u)}
function logout(){localStorage.removeItem('wh_login');location.reload()}
function admin(){document.getElementById('app').innerHTML=`<div class="admin"><div class="adminHead"><b>☰</b><b>Admin Panel</b><span style="margin-left:auto;background:#20a25b;color:white;padding:5px 9px;border-radius:20px;font-size:12px">Admin</span><button onclick="location.reload()">↪</button></div><div class="adminBody"><aside class="side"><button class="active">▦ Dashboard</button><button>＋ Add Wallpaper</button><button>▣ Manage Wallpapers</button><button>▤ Categories</button><button>◆ Tags</button><button>♙ Users</button><button>▥ Analytics</button><button>⚙ Settings</button></aside><section class="dash"><div class="stats"><div class="stat"><small>Total Wallpapers</small><b>1,248</b></div><div class="stat"><small>Total Downloads</small><b>24.5K</b></div><div class="stat"><small>Total Users</small><b>1,320</b></div><div class="stat"><small>Categories</small><b>28</b></div></div><div class="table"><b>Recent Wallpapers</b>${W.slice(0,6).map(w=>`<div class="tr"><img src="${w.u}"><span>${w.t}</span><span class="hide">${w.c}</span><button class="edit">Edit</button></div>`).join('')}</div></section></div></div>`}
if(localStorage.getItem('wh_login'))enter();else document.getElementById('login').classList.remove('hidden');
</script>
</body>
</html>
